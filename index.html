<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      width=device-width: prevents mobile browsers from zooming out to fit a
      desktop layout. user-scalable=no: prevents pinch-zoom mid-game which
      would break the fixed-height layout on iOS Safari.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Rhythm Lyric Game — Magical Mirai 2026</title>
    <script type="module" crossorigin src="/MagicalMirai2026_MikuKaraoke/assets/index-Bq6S-y9Q.js"></script>
    <link rel="stylesheet" crossorigin href="/MagicalMirai2026_MikuKaraoke/assets/index-5lmNB-BD.css">
  </head>
  <body>

    <!--
      Two top-level elements: #hud (8% height) and #stage (92% height).
      They are siblings — #stage is NOT inside #hud.
      This matches the layout diagram in game-design.md exactly.
    -->

    <!-- ── HUD ──────────────────────────────────────────────────────────────
         Top bar: song title on the left, score and combo on the right.
         #btn-play is the playback toggle (introduced in Chunk 2, permanent here).
         All three stat elements start empty; main.ts fills them at runtime.    -->
    <header id="hud">
      <span id="song-title">—</span>
      <div id="hud-stats">
        <span id="score">0</span>
        <span id="combo">0x</span>
      </div>
      <button id="btn-play" aria-label="Play or pause the song">▶ Play</button>
    </header>

    <!-- ── Stage ─────────────────────────────────────────────────────────────
         Full-height container (92vh). position: relative makes it the
         containing block for all absolutely-positioned children below.
         Three children stack in z-order: singer (0) → overlay (1) → pad (2). -->
    <div id="stage">

      <!-- Singer sprite fills the entire stage background.
           src is empty until Chunk 8 adds real art; a placeholder rectangle
           is added via CSS background-color on #stage for now.
           object-fit: cover / object-position: center top (set in CSS) keeps
           the character's face visible above the overlay at all aspect ratios. -->
      <img id="singer" src="" alt="Singer character" />

      <!-- ── Lyric overlay ────────────────────────────────────────────────────
           Semi-transparent box pinned to the bottom ~55% of #stage.
           Contains two phrase rows stacked vertically: active (top) and next
           (bottom). Both rows are always visible so the player can read ahead.

           Each phrase row has:
             - a text container (#phrase-*-text) — two overlapping divs produce
               the dim base + teal clip-path fill effect (Chunk 5)
             - a cue bar (.bar-track) — the horizontal track the playhead dot
               and arrow cue divs sit on                                         -->
      <div id="lyric-overlay" class="hidden">

        <!-- Top row: the phrase currently being sung (active) -->
        <div id="phrase-top">
          <div id="phrase-top-text" class="phrase-text-wrap">
            <!--
              Placeholder: two stacked divs previewing the clip-path color fill.
              Both contain the same sample Japanese text. The colored (teal) div
              uses clip-path: inset(0 40% 0 0) to show ~60% filled.
              lyrics.ts (Chunk 5) will replace these with real phrase text.
            -->
            <div class="phrase-dim">つぎのフレーズがここに表示されます</div>
            <div class="phrase-colored" style="clip-path: inset(0 40% 0 0)">つぎのフレーズがここに表示されます</div>
          </div>
          <!--
            Active cue bar: the playhead dot slides left→right each frame.
            Arrow cue divs are pre-placed at beat positions by arrows.ts.
            Placeholder playhead at 60% and three placeholder cues preview layout.
          -->
          <div id="bar-top" class="bar-track">
            <div class="playhead" style="left: 60%"></div>
            <div class="cue" style="left: 20%">↑</div>
            <div class="cue" style="left: 50%">→</div>
            <div class="cue" style="left: 80%">↓</div>
          </div>
        </div>

        <!-- Bottom row: the next upcoming phrase (dimmed) -->
        <div id="phrase-bottom">
          <div id="phrase-bottom-text" class="phrase-text-wrap">
            <!--
              Placeholder next-phrase text. No color fill on the bottom row —
              it is fully dim until it becomes the active row.
            -->
            <div class="phrase-dim">つぎのつぎのフレーズがここに表示されます</div>
            <div class="phrase-colored" style="clip-path: inset(0 100% 0 0)">つぎのつぎのフレーズがここに表示されます</div>
          </div>
          <!-- Next cue bar: same structure, no active playhead (Chunk 5/6) -->
          <div id="bar-bottom" class="bar-track">
            <div class="cue" style="left: 15%">→</div>
            <div class="cue" style="left: 45%">↑</div>
            <div class="cue" style="left: 70%">↓</div>
            <div class="cue" style="left: 90%">←</div>
          </div>
        </div>

      </div><!-- /#lyric-overlay -->

      <!-- ── Input pad ────────────────────────────────────────────────────────
           Four directional buttons. Positioned at the very bottom of #stage,
           outside and below the lyric overlay, at z-index 2.
           data-direction attributes let main.ts use a single delegated listener
           on #input-pad rather than four separate listeners (Chunk 7).
           Button order matches the design doc diagram: ← ↓ ↑ →              -->
      <div id="input-pad" role="group" aria-label="Directional input buttons">
        <button data-direction="left"  aria-label="Left">←</button>
        <button data-direction="down"  aria-label="Down">↓</button>
        <button data-direction="up"    aria-label="Up">↑</button>
        <button data-direction="right" aria-label="Right">→</button>
      </div>

    </div><!-- /#stage -->

    <!--
      type="module" defers script execution automatically — the DOM above is
      fully parsed before main.ts runs, so every getElementById call is safe
      without a DOMContentLoaded wrapper.
    -->
  </body>
</html>
