<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      width=device-width: prevents mobile browsers from zooming out to fit a
      desktop layout. user-scalable=no: prevents pinch-zoom mid-game which
      would break the fixed-height layout on iOS Safari.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Rhythm Lyric Game — Magical Mirai 2026</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <!--
      Three siblings stack vertically to fill 100vh with no overlap possible:
        #hud       —  8vh — top bar
        #stage     — 72vh — singer + lyric overlay
        #input-pad — 20vh — directional buttons

      #input-pad is a sibling of #stage (NOT a child), identical in structure
      to #hud. This guarantees the pad never overlaps the lyric overlay on any
      screen size — the three sections share 100vh by normal block flow, not
      by z-index stacking.
    -->

    <!-- ── HUD (8vh) ──────────────────────────────────────────────────────── -->
    <header id="hud">
      <span id="song-title">—</span>
      <div id="hud-stats">
        <span id="score">0</span>
        <span id="combo">0x</span>
      </div>
      <button id="btn-play" aria-label="Play or pause the song">▶ Play</button>
    </header>

    <!-- ── Stage (72vh) ──────────────────────────────────────────────────── -->
    <div id="stage">

      <!--
        Singer sprite — layered parts composited via CSS absolute positioning.
        All six <img> elements share the same 1673×1816 canvas coordinate space,
        so stacking them at top:0 left:0 width:100% height:100% reproduces the
        original Procreate layer order exactly with no offset math needed.

        Layer order (bottom → top, matching painter's algorithm):
          body          — torso, clothes, legs: the base of the character
          arm_left_down — left arm in resting position
          arm_right     — right arm holding microphone
          pigtail_left  — left pigtail: behind head, in front of arms
          pigtail_right — right pigtail: same z-level as pigtail_left
          head_idle     — head + face: topmost layer, drawn over everything

        data-layer attributes allow JS to target individual layers for src
        swaps (head expression changes) and CSS animation classes (arm swing).
      -->
      <div id="singer-container" aria-label="Singer character">
        <img id="singer-body"          class="singer-layer" src="/src/assets/singer/body.png"          alt="" aria-hidden="true" data-layer="body" />
        <img id="singer-pigtail-left"  class="singer-layer" src="/src/assets/singer/pigtail_left.png"  alt="" aria-hidden="true" data-layer="pigtail-left" />
        <img id="singer-pigtail-right" class="singer-layer" src="/src/assets/singer/pigtail_right.png" alt="" aria-hidden="true" data-layer="pigtail-right" />
        <img id="singer-arm-right"     class="singer-layer" src="/src/assets/singer/arm_right.png"     alt="" aria-hidden="true" data-layer="arm-right" />
        <img id="singer-head"          class="singer-layer" src="/src/assets/singer/head_idle.png"      alt="" aria-hidden="true" data-layer="head" />
        <img id="singer-arm-left"      class="singer-layer" src="/src/assets/singer/arm_left_down.png" alt="" aria-hidden="true" data-layer="arm-left" />
      </div>

      <!-- ── Lyric overlay ──────────────────────────────────────────────── -->
      <div id="lyric-overlay" class="hidden">

        <div id="phrase-top">
          <div id="phrase-top-text" class="phrase-text-wrap">
            <div class="phrase-dim">つぎのフレーズがここに表示されます</div>
            <div class="phrase-colored" style="clip-path: inset(0 40% 0 0)">つぎのフレーズがここに表示されます</div>
          </div>
          <div id="bar-top" class="bar-track">
            <div class="playhead" style="left: 60%"></div>
            <div class="cue" style="left: 20%">↑</div>
            <div class="cue" style="left: 50%">→</div>
            <div class="cue" style="left: 80%">↓</div>
          </div>
        </div>

        <div id="phrase-bottom">
          <div id="phrase-bottom-text" class="phrase-text-wrap">
            <div class="phrase-dim">つぎのつぎのフレーズがここに表示されます</div>
            <div class="phrase-colored" style="clip-path: inset(0 100% 0 0)">つぎのつぎのフレーズがここに表示されます</div>
          </div>
          <div id="bar-bottom" class="bar-track">
            <div class="cue" style="left: 15%">→</div>
            <div class="cue" style="left: 45%">↑</div>
            <div class="cue" style="left: 70%">↓</div>
            <div class="cue" style="left: 90%">←</div>
          </div>
        </div>

      </div><!-- /#lyric-overlay -->

    </div><!-- /#stage -->

    <!-- ── Input pad (20vh) ───────────────────────────────────────────────────
         Sibling of #stage — sits below it in normal block flow, never overlaps
         the lyric overlay. Four directional buttons fill the full width.
         touch-action: manipulation and -webkit-tap-highlight-color are set in
         CSS to eliminate the 300ms tap delay and grey flash on mobile.        -->
    <div id="input-pad" role="group" aria-label="Directional input buttons">
      <button data-direction="left"  aria-label="Left">←</button>
      <button data-direction="down"  aria-label="Down">↓</button>
      <button data-direction="up"    aria-label="Up">↑</button>
      <button data-direction="right" aria-label="Right">→</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
